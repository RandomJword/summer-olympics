<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Summer Olympics '83 (full screen test)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #touch { display: none; gap: 14px; margin-top: 14px; }
  #touch button {
    width: 88px; height: 88px; border-radius: 50%; border: 4px solid #888; font: bold 15px monospace; color: #fff;
    background: #c02020; touch-action: none;
  }
  #touch button[data-k="A"] { background: #2050c0; }
  #touch button.on { filter: brightness(1.6); }

  /* full screen experiment */
  #fsbar { position: fixed; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 5; transition: opacity .4s; }
  #fsbar button { font: bold 13px monospace; color: #fff; background: rgba(40,40,40,.85); border: 2px solid #888; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  #fsbar button:hover { border-color: #fff; }
  body.idle #fsbar { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  #fsmsg { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font: 13px monospace; color: #ddd; background: rgba(0,0,0,.75); padding: 6px 12px; border-radius: 6px; opacity: 0; transition: opacity .4s; pointer-events: none; z-index: 5; white-space: nowrap; }
  #fsmsg.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="224"></canvas>
<div id="touch">
  <button data-k="L">RUN</button>
  <button data-k="A">JUMP</button>
  <button data-k="R">RUN</button>
</div>
<div id="fsbar">
  <button id="fsmode" title="Scaling (V)">PIXEL-PERFECT</button>
  <button id="fsgo" title="Full screen (F)">FULL SCREEN</button>
</div>
<div id="fsmsg"></div>
<!-- the live game, unchanged -->
<script src="../../js/font.js"></script>
<script src="../../js/audio.js"></script>
<script src="../../js/gfx.js"></script>
<script src="../../js/events.js"></script>
<script src="../../js/main.js"></script>
<!-- the experiment, layered on top -->
<script src="fullscreen.js"></script>
</body>
</html>
