<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Summer Athletics '83</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #touch { display: none; gap: 14px; margin-top: 14px; }
  #touch button {
    width: 88px; height: 88px; border-radius: 50%; border: 4px solid #888; font: bold 15px monospace; color: #fff;
    background: #c02020; touch-action: none;
  }
  #touch button[data-k="A"] { background: #2050c0; }
  #touch button.on { filter: brightness(1.6); }
</style>
</head>
<body>
<canvas id="screen" width="256" height="224"></canvas>
<div id="touch">
  <button data-k="L">RUN</button>
  <button data-k="A">JUMP</button>
  <button data-k="R">RUN</button>
</div>
<script src="js/font.js"></script>
<script src="js/audio.js"></script>
<script src="js/gfx.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
